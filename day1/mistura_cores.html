<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#111318">
<title>Mistura de Cores - Ciencia Viva UFP 2026</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #111318;
    color: #e8e8ec;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
  }

  h1 {
    font-size: 1.3rem;
    margin: 8px 0 2px;
    text-align: center;
  }

  .subtitle {
    font-size: 0.85rem;
    color: #9a9aa5;
    margin-bottom: 16px;
    text-align: center;
  }

  .card {
    width: 100%;
    max-width: 480px;
    background: #1c1f27;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  }

  #preview {
    width: 100%;
    height: 160px;
    border-radius: 12px;
    border: 2px solid #2c2f38;
    margin-bottom: 8px;
    cursor: pointer;
    transition: background-color 0.1s;
  }

  .hint {
    text-align: center;
    font-size: 0.75rem;
    color: #9a9aa5;
    margin-bottom: 16px;
  }

  .slider-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
  }

  .slider-row label {
    width: 24px;
    font-weight: 700;
    font-size: 1.1rem;
    text-align: center;
  }

  .slider-row .value {
    width: 44px;
    text-align: right;
    font-variant-numeric: tabular-nums;
    font-size: 1rem;
    color: #c9c9d2;
  }

  input[type="range"] {
    flex: 1;
    appearance: none;
    -webkit-appearance: none;
    height: 12px;
    border-radius: 6px;
    outline: none;
  }

  input[type="range"]::-webkit-slider-thumb {
    appearance: none;
    -webkit-appearance: none;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #fff;
    border: 3px solid #1c1f27;
    box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    cursor: pointer;
  }

  input[type="range"]::-moz-range-thumb {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #fff;
    border: 3px solid #1c1f27;
    box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    cursor: pointer;
  }

  #sliderR { background: linear-gradient(to right, #000, #f00); }
  #sliderG { background: linear-gradient(to right, #000, #0f0); }
  #sliderB { background: linear-gradient(to right, #000, #00f); }

  .codes {
    display: flex;
    justify-content: space-around;
    margin: 4px 0 16px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.95rem;
  }

  .codes span { color: #c9c9d2; }

  .presets {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  .presets button {
    height: 44px;
    border: 2px solid #2c2f38;
    border-radius: 10px;
    cursor: pointer;
    font-size: 0;
  }

  #fullscreen {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: none;
  }
  #fullscreen.active { display: block; }
</style>
</head>
<body>
  <h1>Mistura de Cores (RGB)</h1>
  <p class="subtitle">Ciencia Viva UFP 2026 &middot; Dia 1</p>

  <div class="card">
    <div id="preview"></div>
    <p class="hint">Toca na cor para ecra inteiro (mostra ao robot!)</p>

    <div class="slider-row">
      <label style="color:#ff5555">R</label>
      <input type="range" id="sliderR" min="0" max="255" value="255">
      <span class="value" id="valR">255</span>
    </div>
    <div class="slider-row">
      <label style="color:#55dd55">G</label>
      <input type="range" id="sliderG" min="0" max="255" value="0">
      <span class="value" id="valG">0</span>
    </div>
    <div class="slider-row">
      <label style="color:#6699ff">B</label>
      <input type="range" id="sliderB" min="0" max="255" value="0">
      <span class="value" id="valB">0</span>
    </div>

    <div class="codes">
      <span id="hexCode">#FF0000</span>
      <span id="rgbCode">rgb(255, 0, 0)</span>
    </div>

    <div class="presets" id="presets"></div>
  </div>

  <div id="fullscreen"></div>

<script>
  const sliders = {
    r: document.getElementById('sliderR'),
    g: document.getElementById('sliderG'),
    b: document.getElementById('sliderB'),
  };
  const values = {
    r: document.getElementById('valR'),
    g: document.getElementById('valG'),
    b: document.getElementById('valB'),
  };
  const preview = document.getElementById('preview');
  const hexCode = document.getElementById('hexCode');
  const rgbCode = document.getElementById('rgbCode');
  const fullscreen = document.getElementById('fullscreen');

  function update() {
    const r = +sliders.r.value, g = +sliders.g.value, b = +sliders.b.value;
    const css = `rgb(${r}, ${g}, ${b})`;
    preview.style.backgroundColor = css;
    fullscreen.style.backgroundColor = css;
    values.r.textContent = r;
    values.g.textContent = g;
    values.b.textContent = b;
    rgbCode.textContent = css;
    hexCode.textContent = '#' + [r, g, b]
      .map(v => v.toString(16).toUpperCase().padStart(2, '0')).join('');
  }

  Object.values(sliders).forEach(s => s.addEventListener('input', update));

  // Cores base para a atividade de detecao com a camara
  const presetColors = [
    [255, 0, 0], [0, 255, 0], [0, 0, 255], [255, 255, 0],
    [255, 128, 0], [255, 0, 255], [0, 255, 255], [255, 255, 255],
  ];
  const presetsEl = document.getElementById('presets');
  presetColors.forEach(([r, g, b]) => {
    const btn = document.createElement('button');
    btn.style.backgroundColor = `rgb(${r}, ${g}, ${b})`;
    btn.addEventListener('click', () => {
      sliders.r.value = r;
      sliders.g.value = g;
      sliders.b.value = b;
      update();
    });
    presetsEl.appendChild(btn);
  });

  preview.addEventListener('click', () => fullscreen.classList.add('active'));
  fullscreen.addEventListener('click', () => fullscreen.classList.remove('active'));

  update();
</script>
</body>
</html>
